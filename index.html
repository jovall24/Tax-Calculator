<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tax Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sales Tax Calculator</h1>
    </header>

    <section>
        <h2>Calculate Your Total</h2>
        <p>Enter a purchase amount to calculate the sales tax at 8.25%.</p>

        <form id="taxForm">
            <label for="purchase">Purchase Amount ($):</label>
            <input type="number" id="purchase" min="0" step="0.01" placeholder="Enter amount" required>
            <br><br>

            <button type="submit">Calculate</button>
            <br><br>

            <label for="tax">Tax Amount ($):</label>
            <input type="text" id="tax" disabled>
            <br><br>

            <label for="total">Total ($):</label>
            <input type="text" id="total" disabled>
        </form>
    </section>

    <script>
        document.getElementById("taxForm").addEventListener("submit", function(event) {
            event.preventDefault();

            var purchase = Number(document.getElementById("purchase").value);
            var tax = Math.round(purchase * 0.0825 * 100) / 100;
            var total = purchase + tax;

            document.getElementById("tax").value = tax.toFixed(2);
            document.getElementById("total").value = total.toFixed(2);
        });
    </script>
</body>
</html>
